<p>Он написал «Привет, как дела?» после паузы. Твоя реакция?</p>
<p>1. Ответила сразу и легко, будто всё нормально</p>
<p>2. Висит в уведомлениях, не открываю диалог</p>
<p>3. Написала сухо: «Всё хорошо, а что хотел?»</p>
<p>4. Руки чешутся высказать всё за эти дни тишины</p>
